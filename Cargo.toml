[package]
name = "oxpulse-turn"
version = "0.2.1"
edition = "2021"
rust-version = "1.70"
publish = true
license = "AGPL-3.0-or-later"
description = "TURN/STUN credential generation (coturn REST API compatible HMAC-SHA1) for WebRTC ICE negotiation"
homepage = "https://oxpulse.chat"
repository = "https://github.com/anatolykoptev/oxpulse-turn"
readme = "README.md"
keywords = ["turn", "stun", "webrtc", "ice", "coturn"]
categories = ["network-programming", "cryptography"]

[features]
default = []
chrono = ["dep:chrono", "chrono/serde"]
openapi = ["dep:utoipa"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
thiserror = "1"
log = "0.4"
chrono = { version = "0.4", optional = true, default-features = false, features = ["std", "clock"] }
utoipa = { version = "4", optional = true }
zeroize = "1.8.2"

[dev-dependencies]
serde_json = "1"
