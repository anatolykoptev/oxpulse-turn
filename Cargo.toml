[package]
name = "oxpulse-turn"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
publish = true
license = "AGPL-3.0-or-later"
description = "TURN/STUN credential generation (coturn REST API compatible HMAC-SHA1) for WebRTC ICE negotiation"
homepage = "https://oxpulse.chat"
readme = "README.md"
keywords = ["turn", "stun", "webrtc", "ice", "coturn"]
categories = ["network-programming", "cryptography"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
